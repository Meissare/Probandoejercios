<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tres en raya - Colores pastel</title>
  <style>
    :root {
      /* Paleta pastel */
      --bg: #f7f7fb;
      --panel: #ffffff;
      --grid: #e6e9f2;
      --x: #ffb3ba;      /* rosa pastel */
      --o: #bae1ff;      /* azul pastel */
      --accent: #c7ffd8; /* verde menta pastel */
      --text: #444a5a;
      --muted: #8b90a1;
      --win: #fff2a8;    /* amarillo pastel */
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(135deg, #f7f7fb 0%, #f0f4ff 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    .app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow:
        0 12px 30px rgba(80, 90, 120, 0.12),
        0 2px 8px rgba(80, 90, 120, 0.08);
      border-radius: 16px;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.2px;
    }
